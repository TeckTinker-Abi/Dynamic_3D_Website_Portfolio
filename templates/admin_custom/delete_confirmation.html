{% extends 'admin_custom/base_admin.html' %}

{% block page_title %}Delete {{ content_label }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-20">
    <div
        class="glass-panel rounded-lg overflow-hidden border border-red-500/30 shadow-[0_0_50px_-12px_rgba(239,68,68,0.2)]">
        <div class="p-6 text-center space-y-4">
            <div
                class="w-16 h-16 rounded-full bg-red-500/10 flex items-center justify-center mx-auto border border-red-500/20">
                <i class="fas fa-exclamation-triangle text-3xl text-red-500"></i>
            </div>

            <h2 class="text-xl font-bold text-white">Delete {{ content_label }}?</h2>

            <p class="text-gray-400 text-sm">
                Are you sure you want to delete <span class="text-white font-mono bg-white/5 px-2 py-0.5 rounded">"{{
                    object }}"</span>?
                <br>This action cannot be undone.
            </p>

            <form method="post" class="pt-4 flex gap-3 justify-center">
                {% csrf_token %}
                <a href="{{ cancel_url }}"
                    class="px-4 py-2 rounded border border-white/10 text-gray-400 hover:text-white hover:bg-white/5 transition-colors text-sm">
                    Cancel
                </a>
                <button type="submit"
                    class="px-6 py-2 rounded bg-red-600 hover:bg-red-500 text-white font-medium shadow-lg shadow-red-600/20 transition-all text-sm">
                    Confirm Delete
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
