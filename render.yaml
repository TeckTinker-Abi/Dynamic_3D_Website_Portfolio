build:
  builder: render
  buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
  startCommand: "gunicorn portfolio_project.wsgi:application"
envVars:
  - key: PYTHON_VERSION
    value: 3.12.2
  - key: DATABASE_URL
    fromDatabase:
      name: antigravity_db
      property: connectionString
  - key: SECRET_KEY
    generateValue: true
  - key: WEB_CONCURRENCY
    value: 4
